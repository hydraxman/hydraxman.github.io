<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070915"/><stop offset="1" stop-color="#101936"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#62f0ff"/><stop offset="1" stop-color="#a997ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".36"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#8cecff"/></marker>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)" rx="34"/>
  <text x="70" y="78" fill="#fff" font-family="Arial, 'PingFang SC', sans-serif" font-size="38" font-weight="800">Warp 客户端架构：从终端到 Agent 控制台</text>
  <text x="70" y="122" fill="#aab7da" font-family="Arial, 'PingFang SC', sans-serif" font-size="22">开源客户端部分：终端运行时、Block 模型、WarpUI、本地 Agent 与 MCP 集成；云端后端不在仓库内。</text>
  <g fill="none" stroke="#3b466f" stroke-width="2" stroke-dasharray="10 8">
    <rect x="50" y="160" width="1010" height="560" rx="32"/>
    <rect x="1090" y="380" width="250" height="160" rx="32"/>
  </g>
  <text x="80" y="196" fill="#7ff3ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Open-source Client</text>
  <text x="1120" y="416" fill="#c9bdff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Hosted / Proprietary</text>
  <g font-family="Arial, 'PingFang SC', sans-serif" filter="url(#shadow)">
    <rect x="90" y="245" width="260" height="120" rx="24" fill="#151b35" stroke="#33406b"/>
    <text x="125" y="292" fill="#fff" font-size="25" font-weight="700">Shell / PTY</text>
    <text x="125" y="330" fill="#aab7da" font-size="18">bash · zsh · fish · ssh</text>
    <rect x="430" y="245" width="260" height="120" rx="24" fill="#151b35" stroke="#33406b"/>
    <text x="465" y="292" fill="#fff" font-size="25" font-weight="700">Block Model</text>
    <text x="465" y="330" fill="#aab7da" font-size="18">cmd · output · exit · cwd</text>
    <rect x="770" y="245" width="260" height="120" rx="24" fill="#151b35" stroke="#33406b"/>
    <text x="805" y="292" fill="#fff" font-size="25" font-weight="700">WarpUI</text>
    <text x="805" y="330" fill="#aab7da" font-size="18">Rust · WGPU · Metal</text>
    <rect x="260" y="510" width="280" height="120" rx="24" fill="#151b35" stroke="#33406b"/>
    <text x="295" y="557" fill="#fff" font-size="25" font-weight="700">Agent SDK</text>
    <text x="295" y="595" fill="#aab7da" font-size="18">Oz · Claude · Codex · Gemini</text>
    <rect x="650" y="510" width="280" height="120" rx="24" fill="#151b35" stroke="#33406b"/>
    <text x="685" y="557" fill="#fff" font-size="25" font-weight="700">MCP Tools</text>
    <text x="685" y="595" fill="#aab7da" font-size="18">CLI · SSE · HTTP</text>
    <rect x="1125" y="445" width="180" height="95" rx="22" fill="#201a38" stroke="#4d3f87"/>
    <text x="1160" y="485" fill="#fff" font-size="24" font-weight="700">Cloud*</text>
    <text x="1160" y="517" fill="#aab7da" font-size="18">Drive · Oz</text>
  </g>
  <g stroke="url(#line)" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M350 305 H430"/>
    <path d="M690 305 H770"/>
    <path d="M560 365 C560 430 475 455 420 510"/>
    <path d="M540 570 H650"/>
    <path d="M930 570 C1020 570 1045 495 1125 495"/>
  </g>
  <g font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#8c98bd">
    <text x="90" y="410">PTY 字符流与 shell hooks 被解释为结构化 Block。</text>
    <text x="430" y="685">Agent 在同一工作台里读取上下文、运行命令、调用 MCP 工具，并把结果交给人类审查。</text>
    <text x="70" y="775">* Server、Warp Drive backend、Oz orchestration 不包含在开源仓库中；客户端大部分 AGPL v3，warpui / warpui_core 为 MIT。</text>
  </g>
</svg>